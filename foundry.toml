[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache/forge"
libs = ["node_modules", "lib"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
